name: Trivy Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - '002-helming/**'
      - '.github/workflows/02-trivy-scan.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '002-helming/**'
      - '.github/workflows/02-trivy-scan.yaml'

jobs:
  security-scan:
    name: Scan Charts for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Security Scanner on Helm Charts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '002-helming/'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
