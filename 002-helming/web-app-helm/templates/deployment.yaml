apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app-helm
  template:
    metadata:
      labels:
        app: web-app-helm
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
