apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-helm
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: web-app-helm
  template:
    metadata:
      labels:
        app: web-app-helm
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
